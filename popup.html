<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 18px;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #111;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p.sub { margin: 0 0 16px; color: #666; font-size: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
    }
    .hint { font-size: 12px; color: #666; margin: 6px 0 16px; }
    .row { display: flex; gap: 8px; align-items: flex-start; }
    .row input { margin-top: 3px; }
    .row label { font-weight: 400; margin: 0; }
    #status { font-size: 12px; color: #1f9d55; height: 16px; margin-top: 12px; }
    a { color: #111; }
  </style>
</head>
<body>
  <h1>PDBHL</h1>
  <p class="sub">Pin Downloader by HL. Passe o mouse num pin e clique na setinha.</p>

  <label for="folder">Pasta de destino</label>
  <input id="folder" type="text" placeholder="Pinterest" />
  <p class="hint">Fica dentro da sua pasta de Downloads do Chrome. Use barras para subpastas, ex: <b>Referências/Pinterest</b>.</p>

  <div class="row">
    <input id="saveAs" type="checkbox" />
    <label for="saveAs">Perguntar onde salvar a cada download</label>
  </div>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
